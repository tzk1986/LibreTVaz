<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LibreTVaz · FongMi 交互模拟</title>
<style>
  /* 按 FongMi leanback flavor 复刻：VerticalGridView 行式首页、焦点白框放大 */
  :root {
    --bg: #14171a; --bg2: #1d2124; --fg: #e8eaed; --dim: #9aa0a6;
    --accent: #3ea6ff; --card: #26292d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #000; color: var(--fg); font: 15px/1.5 "Segoe UI", "Microsoft YaHei", sans-serif; overflow: hidden; }
  button, input { font: inherit; color: inherit; background: none; border: none; }

  /* 顶部：logo + 站名(可点弹源列表) + 时钟，滚动隐藏 */
  header { display: flex; align-items: center; gap: 14px; padding: 12px 28px 6px; flex: none; }
  header.hide { display: none; }
  .logo { width: 40px; height: 40px; border-radius: 10px; background: linear-gradient(135deg, #3ea6ff, #7c5cff); display: flex; align-items: center; justify-content: center; font-weight: 700; color: #000; }
  .sitename { font-size: 18px; font-weight: 600; padding: 4px 10px; border-radius: 6px; cursor: pointer; }
  .clock { margin-left: auto; color: var(--dim); font-size: 16px; }

  #body { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  main { flex: 1; overflow-y: auto; padding: 8px 28px 28px; outline: none; }
  main::-webkit-scrollbar { width: 6px; } main::-webkit-scrollbar-thumb { background: #3a3f44; border-radius: 3px; }

  .rowhead { margin: 18px 0 10px; font-size: 17px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
  .rowhead small { color: var(--dim); font-weight: 400; }

  /* 功能行：点播/直播/搜索/收藏/连接/设置 */
  .funcs { display: flex; gap: 14px; padding: 8px 0 4px; }
  .func { width: 148px; height: 88px; border-radius: 10px; background: var(--card); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; cursor: pointer; border: 2px solid transparent; }
  .func b { font-size: 16px; } .func i { font-style: normal; color: var(--dim); font-size: 12px; }

  /* 网格卡片（Fongmi adapter_vod_rect：remark 名称在上、图、年/源角标） */
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; }
  @media (max-width: 1100px) { .grid { grid-template-columns: repeat(4, 1fr); } }
  .card { cursor: pointer; border-radius: 8px; padding: 3px; border: 2px solid transparent; position: relative; }
  .card .pic { aspect-ratio: 2/3; border-radius: 6px; background: var(--card); overflow: hidden; position: relative; }
  .card .pic img { width: 100%; height: 100%; object-fit: cover; display: block; position: relative; }
  .card .pic .ph { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 10px; font-size: 15px; line-height: 1.5; color: #7a8087; background: linear-gradient(160deg, #23272b, #191c1f); overflow: hidden; }
  .card .year { position: absolute; right: 4px; top: 4px; background: rgba(0,0,0,.6); color: #ffd76e; font-size: 11px; padding: 1px 6px; border-radius: 3px; }
  .card .site { position: absolute; left: 4px; top: 4px; background: rgba(0,0,0,.6); color: var(--dim); font-size: 10px; padding: 1px 5px; border-radius: 3px; }
  .card .remark { position: absolute; right: 6px; bottom: 4px; color: #ffd76e; font-size: 11px; text-shadow: 0 1px 2px #000; }
  .card .name { margin-top: 6px; font-size: 13px; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .del { position: absolute; left: 2px; top: 2px; width: 20px; height: 20px; border-radius: 50%; background: rgba(0,0,0,.7); color: #fff; display: none; align-items: center; justify-content: center; z-index: 2; }
  .card .upd { position: absolute; right: 4px; top: 4px; width: 10px; height: 10px; border-radius: 50%; background: #e53935; box-shadow: 0 0 6px #e53935; z-index: 1; }
  .card.focus .del { display: flex; }

  .kb { width: 40px; text-align: center; padding: 6px 0; }

  /* 扫码远程输入块 */
  #qrBig canvas { border-radius: 8px; }

  .hrow { display: flex; gap: 10px; overflow-x: auto; padding: 4px 2px; scrollbar-width: none; align-items: center; }
  .hrow::-webkit-scrollbar { display: none; }
  .chip { background: var(--bg2); border: 2px solid transparent; border-radius: 4px; padding: 7px 16px; cursor: pointer; white-space: nowrap; color: var(--dim); }
  .chip.on { color: #000; background: var(--fg); font-weight: 600; }
  .btn { background: var(--bg2); border: 2px solid transparent; border-radius: 4px; padding: 5px 14px; cursor: pointer; white-space: nowrap; display: inline-block; }
  .btn.on { color: #000; background: var(--accent); }
  .btn.prog { position: relative; }
  .btn.prog::after { content: ''; position: absolute; top: 3px; right: 3px; width: 6px; height: 6px; border-radius: 50%; background: #e53935; }

  /* 遥控器焦点 */
  .focus { border-color: #fff !important; transform: scale(1.05); box-shadow: 0 0 14px rgba(255,255,255,.35); position: relative; z-index: 5; }
  .chip.focus, .btn.focus { background: #fff; color: #000; }

  .muted { color: var(--dim); } .err { color: #f28b82; } .ok { color: #81c995; }
  .hint { color: #6d7378; font-size: 12px; padding: 4px 28px 8px; flex: none; }

  /* 源选择弹窗（SiteDialog） */
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.86); display: none; z-index: 40; }
  .modal.open { display: block; }
  .sitegrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; padding: 60px 48px; max-height: 100vh; overflow: auto; }
  .siteitem { background: var(--card); border: 2px solid transparent; border-radius: 8px; padding: 14px; cursor: pointer; text-align: center; }
  .siteitem.on { border-color: var(--accent); }
  .siteitem.dead { opacity: .45; }

  /* 源管理弹窗 */
  .srcmgr { padding: 56px 48px; max-height: 100vh; overflow: auto; }
  .srcmgr h3 { margin: 14px 0 8px; }
  .srcrow { display: flex; align-items: center; gap: 10px; background: var(--card); border: 2px solid transparent; border-radius: 6px; padding: 8px 14px; margin-bottom: 6px; }
  .srcrow .n { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .srcrow .url { color: var(--dim); font-size: 11px; max-width: 46%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .srcrow .rm { color: #f28b82; cursor: pointer; padding: 2px 10px; border: 2px solid transparent; border-radius: 4px; }

  /* 直播：全屏播放器 + 叠加层 + 右侧三列面板 */
  .livewrap { position: relative; flex: 1; min-height: 0; margin: 0 28px 12px; background: #000; border-radius: 8px; overflow: hidden; }
  .livewrap video { width: 100%; height: 100%; outline: none; }
  .ltop { position: absolute; left: 16px; top: 12px; right: 16px; display: flex; align-items: baseline; gap: 14px; pointer-events: none; text-shadow: 0 1px 3px #000; z-index: 6; }
  .ltop .t { font-size: 20px; font-weight: 700; }
  .ltop .s { color: #ffd76e; font-size: 14px; }
  .ltop .c { margin-left: auto; font-size: 16px; color: #ddd; }
  .lbottom { position: absolute; left: 16px; right: 16px; bottom: 10px; display: flex; gap: 16px; align-items: center; background: rgba(20,23,26,.75); border-radius: 6px; padding: 6px 14px; font-size: 13px; pointer-events: none; z-index: 6; }
  .lbottom .num { color: var(--accent); font-size: 18px; font-weight: 700; }
  .lpanel { position: absolute; top: 0; right: 0; bottom: 0; width: 620px; display: none; background: rgba(20,23,26,.92); z-index: 8; }
  .lpanel.open { display: grid; grid-template-columns: 1fr 1.3fr 1.2fr; }
  .lpanel .col { overflow-y: auto; border-left: 1px solid #333; scrollbar-width: thin; }
  .lpanel .li { padding: 8px 12px; cursor: pointer; font-size: 13px; border-left: 3px solid transparent; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lpanel .li.on { background: #2c3136; color: var(--accent); border-left-color: var(--accent); }
  .lpanel .li { position: relative; }
  #colChan .li { padding-right: 30px; }
  .fav { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); color: #6d7378; padding: 0 4px; }
  .fav.on { color: #ffd700; }
  .lpanel .li .epg-desc { white-space: normal; font-size: 12px; color: var(--dim); margin-top: 3px; }
  .digital { position: absolute; left: 50%; top: 40%; transform: translate(-50%,-50%); font-size: 88px; font-weight: 700; color: #fff; text-shadow: 0 2px 12px #000; display: none; z-index: 9; }

  /* 详情/播放一体（VideoActivity 风格） */
  .vtop { display: flex; gap: 20px; padding: 8px 28px; flex: none; }
  .vtop video { flex: none; width: 400px; height: 225px; background: #000; border-radius: 6px; outline: none; }
  .vtop .txt { flex: 1; min-width: 0; overflow-y: auto; max-height: 238px; font-size: 13px; }
  .vtop h2 { font-size: 20px; }
  .vtop .meta { color: var(--dim); margin: 3px 0; }
  .vtop .content { margin-top: 6px; color: #c8ccd0; }
  .slabel { flex: none; width: 56px; color: var(--dim); font-size: 13px; padding-top: 8px; }
  .eprow { display: flex; align-items: center; padding: 4px 28px; gap: 8px; flex: none; }

  /* 搜索 */
  .sbox { display: flex; gap: 10px; padding: 10px 28px; flex: none; }
  .sbox input { flex: 1; background: var(--bg2); border: 2px solid #3a3f44; border-radius: 6px; padding: 8px 14px; outline: none; }
  .sbox input.focus { border-color: #fff; }
  .colhead { padding: 6px 28px 0; font-size: 18px; font-weight: 600; flex: none; }

  #toast { position: fixed; left: 50%; top: 18%; transform: translateX(-50%); background: rgba(0,0,0,.8); border-radius: 6px; padding: 8px 22px; font-size: 14px; display: none; z-index: 60; }
</style>
</head>
<body>
<div id="app" style="display:flex;flex-direction:column;height:100%">
  <header id="bar">
    <div class="logo">F</div>
    <button class="sitename" data-focus id="siteName">LibreTVaz·模拟</button>
    <span class="clock" id="clock"></span>
  </header>
  <div id="body"></div>
  <div class="hint">遥控器模拟：方向键移动焦点 · Enter 确认 · Esc 返回 · 数字键换台(直播) · 也可直接鼠标点击</div>
</div>
<div class="modal" id="siteModal"><div class="sitegrid" id="siteGrid"></div></div>
<div class="modal" id="findModal"><div style="max-width:760px;margin:10vh auto 0;padding:0 20px">
  <div class="sbox" style="padding:0 0 10px"><input id="findKw" placeholder="片名可编辑，回车全源搜索，Esc 关闭"><button class="btn" id="findGo" data-focus>全源搜索</button></div>
  <div id="findRes" style="max-height:60vh;overflow:auto;background:var(--card);border-radius:8px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px"></div>
</div></div>
<div class="modal" id="srcModal"><div class="srcmgr" id="srcMgr"></div></div>
<div class="modal" id="qrModal"><div style="max-width:520px;margin:5vh auto 0;padding:0 20px;text-align:center">
  <div id="qrBig" style="display:flex;justify-content:center"></div>
  <p class="muted" id="qrHint" style="margin:12px 0 6px;font-size:13px"></p>
  <a id="qrUrl" href="#" target="_blank" style="color:var(--accent);font-size:12px;word-break:break-all"></a>
  <div style="margin-top:16px"><button class="btn" data-focus id="qrClose">关闭(Esc)</button></div>
</div></div>
<div id="toast"></div>
<script src="vendor/hls.min.js"></script>
<script src="vendor/qrcode.js"></script>
<script src="perf-core.js"></script>
<script src="fongmi.js"></script>
</body>
</html>
