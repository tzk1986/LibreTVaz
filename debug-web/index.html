<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LibreTVaz Web 模拟调试台</title>
<style>
  :root { --bg:#0d1117; --panel:#161b22; --line:#2d333b; --fg:#e6edf3; --dim:#8b949e; --acc:#38bdf8; --err:#f85149; --ok:#3fb950; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 "Segoe UI","Microsoft YaHei",sans-serif; }
  header { display:flex; align-items:center; gap:16px; padding:12px 20px; background:var(--panel); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; }
  header h1 { font-size:20px; margin:0; color:var(--acc); }
  nav button, .btn { background:#1f6feb; color:#fff; border:0; border-radius:8px; padding:7px 16px; font-size:14px; cursor:pointer; }
  nav button.ghost, .btn.ghost { background:transparent; border:1px solid var(--line); color:var(--fg); }
  nav button.active { background:var(--acc); color:#04222e; font-weight:600; }
  nav button:hover, .btn:hover { filter:brightness(1.15); }
  main { padding:16px 20px; }
  .chips { display:flex; gap:8px; flex-wrap:nowrap; overflow-x:auto; padding:4px 0; }
  .chip { flex:0 0 auto; background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:4px 14px; cursor:pointer; font-size:13px; }
  .chip.sel { background:var(--acc); color:#04222e; border-color:var(--acc); font-weight:600; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:14px; margin-top:12px; }
  .card { cursor:pointer; }
  .card .poster { position:relative; width:100%; aspect-ratio:2/3; background:#232a33; border-radius:8px; overflow:hidden; }
  .card img { width:100%; height:100%; object-fit:cover; display:block; }
  .badge { position:absolute; top:4px; right:4px; background:rgba(56,189,248,.9); color:#04222e; font-size:11px; border-radius:4px; padding:1px 6px; max-width:90%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .card .name { margin-top:4px; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .card .meta { font-size:11px; color:var(--dim); }
  .adult { color:var(--err); font-size:11px; border:1px solid var(--err); border-radius:3px; padding:0 3px; margin-right:4px; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  input[type=text] { background:var(--panel); border:1px solid var(--line); border-radius:8px; color:var(--fg); padding:8px 12px; font-size:14px; min-width:280px; }
  .list { margin-top:10px; }
  .item { display:flex; justify-content:space-between; gap:12px; padding:10px 8px; border-bottom:1px solid var(--line); cursor:pointer; align-items:center; }
  .item:hover { background:var(--panel); }
  .item .src { color:var(--acc); font-size:12px; flex:0 0 auto; }
  .muted { color:var(--dim); font-size:13px; }
  .err { color:var(--err); font-size:13px; }
  .ok { color:var(--ok); font-size:13px; }
  .ep { display:inline-block; background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:5px 12px; margin:4px 6px 0 0; cursor:pointer; font-size:13px; }
  .ep:hover { border-color:var(--acc); }
  #modal { position:fixed; inset:0; background:rgba(0,0,0,.85); display:none; align-items:center; justify-content:center; z-index:20; }
  #modal.show { display:flex; }
  #modal .box { width:min(960px,92vw); background:var(--panel); border-radius:12px; padding:14px; }
  video { width:100%; max-height:64vh; background:#000; border-radius:8px; }
  table { border-collapse:collapse; margin-top:10px; width:100%; font-size:13px; }
  td,th { border-bottom:1px solid var(--line); padding:6px 8px; text-align:left; }
  h3 { margin:18px 0 6px; }
  .del { color:var(--err); cursor:pointer; border:0; background:none; font-size:13px; }
</style>
</head>
<body>
<header>
  <h1>LibreTVaz</h1>
  <nav class="row" id="tabs">
    <button data-tab="browse">影视首页</button>
    <button data-tab="search">搜索观影</button>
    <button data-tab="live">看电视</button>
    <button data-tab="sources">源管理</button>
  </nav>
</header>
<main id="view"></main>
<div id="modal"><div class="box">
  <div class="row" style="justify-content:space-between">
    <b id="mtitle"></b><button class="btn ghost" onclick="closePlayer()">关闭</button>
  </div>
  <video id="video" controls autoplay playsinline></video>
</div></div>
<script src="app.js"></script>
</body>
</html>
